[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wagerpicks"
version = "0.1.0"
description = "WagerTalk free-picks scraper: parse the free-sports-picks page and publish a static picks page"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["wagertalk", "sports", "picks", "scraper", "github-pages"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
wagerpicks = "scrape:main"

[project.urls]
Homepage = "https://github.com/jfkeis/picks"
Issues = "https://github.com/jfkeis/picks/issues"

[tool.setuptools]
py-modules = ["scrape"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]